<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رَتِّب — Rattib</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1e;
            --accent-gold: #d4af37;
            --text-light: #f5f5f7;
            --text-gray: #a1a1a6;
            --danger: #e63946;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #2a2a2e;
            margin-bottom: 20px;
        }
        header h1 {
            color: var(--accent-gold);
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        header p {
            color: var(--text-gray);
            font-size: 14px;
            margin-top: 5px;
        }
        .add-task-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a30;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #3a3a40;
            background-color: #24242a;
            color: var(--text-light);
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        button.btn-primary {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 0;
            margin-top: 5px;
        }
        button.btn-primary:active {
            opacity: 0.8;
        }
        .task-item {
            background-color: var(--card-bg);
            border-right: 4px solid var(--accent-gold);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .task-info span {
            font-size: 12px;
            color: var(--text-gray);
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 4px 8px;
            margin: 0;
        }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="app-container">
    <header>
        <h1>رَتِّب</h1>
        <p>مُنظّم المهام والتنبيهات اليومية</p>
    </header>

    <div class="add-task-card">
        <input type="text" id="taskTitle" placeholder="عنوان المهمة (مثلاً: موعد دواء، اجتماع)...">
        <input type="time" id="taskTime">
        <button class="btn-primary" onclick="addTask()">إضافة المهمة</button>
    </div>

    <div id="taskList"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadTasks);

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const time = document.getElementById('taskTime').value;

        if (!title || !time) {
            alert('يرجى كتابة عنوان المهمة وتحديد الوقت!');
            return;
        }

        const task = { id: Date.now(), title, time };
        let tasks = JSON.parse(localStorage.getItem('rattib_tasks') || '[]');
        tasks.push(task);
        localStorage.setItem('rattib_tasks', JSON.stringify(tasks));

        document.getElementById('taskTitle').value = '';
        document.getElementById('taskTime').value = '';
        
        loadTasks();
        requestNotificationPermission();
    }

    function loadTasks() {
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        const tasks = JSON.parse(localStorage.getItem('rattib_tasks') || '[]');

        tasks.forEach(task => {
            const div = document.createElement('div');
            div.className = 'task-item';
            div.innerHTML = `
                <div class="task-info">
                    <h4>${task.title}</h4>
                    <span>⏰ ${task.time}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
            `;
            taskList.appendChild(div);
        });
    }

    function deleteTask(id) {
        let tasks = JSON.parse(localStorage.getItem('rattib_tasks') || '[]');
        tasks = tasks.filter(t => t.id !== id);
        localStorage.setItem('rattib_tasks', JSON.stringify(tasks));
        loadTasks();
    }

    function requestNotificationPermission() {
        if ('Notification' in window && Notification.permission !== 'granted') {
            Notification.requestPermission();
        }
    }
</script>

</body>
</html>
